<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鲁浩然</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --zw-accent: #ffffff;     /* 强调色统一为白，不再用青绿 */
    --zw-ming: #D4A843;      /* 命宫标记 */
    --zw-shen: #64A8E8;     /* 身宫标记 */
    --zw-hua-lu: #EDEDED;    /* 四化·禄：改白，不用绿 */
    --zw-hua-quan: #E8933E;
    --zw-hua-ke: #7EB1F5;
    --zw-hua-ji: #F06A6A;
    --zw-line: rgba(255,255,255,.09);
    --zw-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --zw-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Source Han Sans SC",
               "Microsoft YaHei", sans-serif;
    /* Q 弹曲线：过冲回弹 */
    --zw-spring: cubic-bezier(.34, 1.56, .64, 1);
  }

  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    background: #000;
    -webkit-text-size-adjust: 100%;   /* 防止 iOS 横竖屏切换时自动放大字号 */
    text-size-adjust: 100%;
    font-family: var(--zw-sans);
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  /* mos 原站顶部那层灰色径向柔光 */
  .bg-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 50% -8%, rgba(58,60,72,.22), transparent 56%);
  }
  #sky {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 文字层：左对齐，位置按黄金分割摆放 */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .block {
    position: absolute;
    left: 0;
    /* 重心精确落在视口高度的 38.2% */
    top: 38.2%;
    transform: translate3d(0, -50%, 0);
    padding-left: clamp(22px, 9.5vw, 160px);
  }

  .line {
    font-family: var(--zw-sans);
    font-weight: 600;
    font-size: clamp(40px, 5.6vw, 78px);
    letter-spacing: .14em;
    line-height: 1.2;
    color: rgba(255,255,255,.92);
    white-space: nowrap;
  }

  .l1 { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
  .l2 { animation: rise 1s cubic-bezier(.2,.8,.2,1) .12s both; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }

  /* ---------- 紫微命门入口（首页文字下方 · 果冻按钮） ---------- */
  /* 外层 = 静态命中区；内层 .zw-jelly-body = 视觉整体，被弹簧拴在原位可拖拽 */
  .zw-entry {
    pointer-events: auto;
    position: relative;
    display: inline-flex;
    margin-top: clamp(26px, 5vh, 48px);
    padding: 0;
    background: none;
    border: none;
    cursor: none;                 /* 悬停时藏光标 */
    font-family: var(--zw-mono);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    animation: rise 1s cubic-bezier(.2,.8,.2,1) .55s both;
  }
  .zw-entry:focus-visible { outline: 2px solid rgba(255,255,255,.55); outline-offset: 3px; border-radius: 17px; }

  .zw-jelly-body {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 30px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 17px;
    color: rgba(255,255,255,.92); /* 与标题同一白 */
    font-size: 12.5px;
    letter-spacing: .32em;
    user-select: none;
    -webkit-user-select: none;
    transition: border-color .3s, background .3s;
    will-change: transform;
  }
  .zw-entry:hover .zw-jelly-body { border-color: rgba(255,255,255,.34); background: rgba(255,255,255,.07); }

  .zw-entry-txt {
    white-space: nowrap;
    padding-left: .32em;   /* 抵消 letter-spacing 尾巴，视觉居中 */
  }

  /* ---------- 紫微命门浮层（透明 · 无遮罩 · 单屏不滚动） ---------- */
  .zw-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    /* 左内边距与首页文字同一轴线，视觉上连贯 */
    padding: clamp(18px, 4vh, 46px) clamp(22px, 6vw, 110px) clamp(18px, 4vh, 46px) clamp(22px, 9.5vw, 160px);
    background: transparent;            /* 不压暗、不遮罩：星空原样透出 */
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    overflow: hidden;                   /* 桌面端：整屏一页，不滚动 */
    overscroll-behavior: contain;
    transition: opacity .5s ease, visibility .5s;
    color-scheme: dark;
  }
  .zw-overlay.on { opacity: 1; visibility: visible; pointer-events: auto; }

  /* 面板：占满浮层可用高度，内容在内部自己分配，全程不产生页面滚动 */
  .zw-panel {
    width: 100%;
    max-width: 1180px;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    transform: translateY(16px);
    opacity: 0;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
  }
  /* 打开：等首页文字退场过半再浮现 */
  .zw-overlay.on .zw-panel {
    transform: none;
    opacity: 1;
    transition: transform .65s cubic-bezier(.2,.8,.2,1) .34s, opacity .55s ease .34s;
  }

  #zw-body { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  .zw-close {
    position: fixed;
    top: 22px;
    right: clamp(18px, 4vw, 44px);
    z-index: 60;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    color: rgba(255,255,255,.5);
    font-family: var(--zw-mono);
    font-size: 11px;
    letter-spacing: .12em;
    padding: 7px 12px;
    cursor: pointer;
    transition: all .25s;
    opacity: 0;
    pointer-events: none;
  }
  body.zw-open .zw-close { opacity: 1; pointer-events: auto; }
  .zw-close:hover { color: #fff; border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.08); }
  .zw-close:active { transform: scale(.93); }

  /* 打开命门：首页文字缓慢隐去、入口退场（星空继续流动，不冻结） */
  /* 注意：rise 动画的 both 填充会把末帧钉在元素上、压过这里的 opacity，
     必须同时摘掉动画才能让过渡生效 */
  .stage .line,
  .stage .zw-entry {
    transition: opacity .7s ease, filter .7s ease;
    transition-delay: .25s;              /* 关闭时：等面板退完再淡回 */
  }
  body.zw-open .stage .line,
  body.zw-open .stage .zw-entry { animation: none; transition-delay: 0s; }
  body.zw-open .stage .line { opacity: 0; filter: blur(8px); }
  body.zw-open .stage .zw-entry { opacity: 0; pointer-events: none; }

  /* ---------- 浮层内文字层级 ---------- */
  .zw-label {
    font-family: var(--zw-mono);
    font-size: 11px;
    letter-spacing: .3em;
    color: rgba(255,255,255,.42);
    text-shadow: 0 0 14px rgba(0,0,0,.7);
  }
  .zw-title {
    font-weight: 600;
    font-size: clamp(26px, 3.4vw, 40px);
    letter-spacing: .12em;
    color: rgba(255,255,255,.94);
    margin-top: 12px;
    line-height: 1.25;
    text-shadow: 0 0 18px rgba(0,0,0,.75);
  }
  /* ---------- 双栏骨架：左文右表 / 左解读右命盘 ---------- */
  .zw-cols {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
    gap: clamp(28px, 4.5vw, 68px);
    padding-top: clamp(16px, 3vh, 30px);
  }
  /* 表单页：单列贴左轴线（与首页文字同一黄金分割位置） */
  .zw-cols-form {
    width: 100%;
    max-width: 420px;
    margin: 0;
    grid-template-columns: minmax(0, 1fr);
    align-content: center;
  }
  .zw-col {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .zw-col-form { justify-content: center; }

  /* ---------- 表单 ---------- */
  .zw-form {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .zw-form-head { margin-bottom: 8px; }
  .zw-field { display: flex; flex-direction: column; gap: 6px; }
  .zw-field > label {
    font-family: var(--zw-mono);
    font-size: 10.5px;
    letter-spacing: .22em;
    color: rgba(255,255,255,.44);
  }
  .zw-req { font-style: normal; color: rgba(233,199,124,.85); letter-spacing: 0; }
  .zw-seg {
    display: inline-flex;
    width: fit-content;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 11px;
    overflow: hidden;
    transition: border-color .25s;
  }
  .zw-seg button {
    background: transparent;
    border: none;
    color: rgba(255,255,255,.5);
    padding: 9px 22px;
    font-size: 13px;
    letter-spacing: .1em;
    cursor: pointer;
    transition: all .22s;
    font-family: var(--zw-sans);
  }
  .zw-seg button.sel { background: rgba(255,255,255,.13); color: #fff; }
  .zw-seg button:not(.sel):hover { color: rgba(255,255,255,.85); background: rgba(255,255,255,.04); }

  .zw-input, .zw-select {
    width: 100%;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 11px;
    color: rgba(255,255,255,.9);
    padding: 10px 13px;
    font-size: 14px;
    font-family: var(--zw-sans);
    outline: none;
    transition: border-color .22s, box-shadow .22s;
    appearance: none;
    -webkit-appearance: none;
  }
  .zw-select {
    background-image: linear-gradient(45deg, transparent 50%, rgba(255,255,255,.4) 50%),
                      linear-gradient(135deg, rgba(255,255,255,.4) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px;
    background-repeat: no-repeat;
    padding-right: 34px;
    cursor: pointer;
  }
  .zw-select option { background: #101316; color: rgba(255,255,255,.9); }
  .zw-input:focus, .zw-select:focus {
    border-color: rgba(255,255,255,.55);
    box-shadow: 0 0 0 3px rgba(255,255,255,.1);
  }
  .zw-row { display: flex; gap: 10px; }
  .zw-row > * { flex: 1; min-width: 0; }

  .zw-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,.6); cursor: pointer; user-select: none; }
  .zw-check input { accent-color: var(--zw-accent); width: 15px; height: 15px; cursor: pointer; }

  .zw-go {
    margin-top: 4px;
    border: 1px solid rgba(255,255,255,.4);
    color: rgba(255,255,255,.95);
    background: rgba(255,255,255,.06);
    border-radius: 13px;
    padding: 12px;
    font-size: 15px;
    letter-spacing: .42em;
    text-indent: .42em;
    font-weight: 600;
    font-family: var(--zw-sans);
    cursor: pointer;
    transition: transform .3s var(--zw-spring), background .25s, box-shadow .25s;
  }
  .zw-go:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.6); box-shadow: 0 6px 26px rgba(255,255,255,.08); transform: translateY(-1px); }
  .zw-go:active { transform: scale(.96); }
  .zw-go[disabled] { opacity: .45; pointer-events: none; }

  .zw-err {
    display: none;
    font-family: var(--zw-mono);
    font-size: 12px;
    color: var(--zw-hua-ji);
    background: rgba(240,106,106,.08);
    border: 1px solid rgba(240,106,106,.25);
    border-radius: 10px;
    padding: 9px 13px;
  }
  .zw-err.on { display: block; animation: zwShake .4s; }
  @keyframes zwShake {
    25% { transform: translateX(-5px); } 75% { transform: translateX(5px); }
  }

  /* ---------- 命盘十二宫 ---------- */
  .zw-head {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: nowrap;
    padding-bottom: clamp(10px, 1.6vh, 18px);
  }
  .zw-head > div { min-width: 0; flex: 1; }
  .zw-title-chart {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zw-rebtn {
    flex: none;
    background: none;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 9px;
    color: rgba(255,255,255,.55);
    font-family: var(--zw-mono);
    font-size: 11px;
    letter-spacing: .15em;
    padding: 6px 13px;
    cursor: pointer;
    transition: all .25s;
  }
  .zw-rebtn:hover { color: #fff; border-color: rgba(255,255,255,.32); }
  .zw-rebtn:active { transform: scale(.94); }

  .zw-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: clamp(4px, .6vw, 9px);
    container-type: size;          /* 字号按可用高度等比缩放，保证一屏装下 */
  }
  .zw-cell {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: clamp(4px, 1.6cqh, 10px) clamp(5px, .9vw, 11px);
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    animation: zwCellIn .5s cubic-bezier(.2,.8,.2,1) both;
    overflow: hidden;
  }
  .zw-cell.cur {
    border-color: rgba(233,199,124,.45);
    background: rgba(233,199,124,.055);
  }
  @keyframes zwCellIn {
    from { opacity: 0; transform: scale(.88) translateY(8px); filter: blur(5px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }

  .zw-cell-top { display: flex; align-items: center; gap: 3px; padding-right: 4px; }
  .zw-gname { font-size: clamp(9.5px, 1.7cqh, 12.5px); letter-spacing: .06em; color: rgba(255,255,255,.66); white-space: nowrap; }
  .zw-gname.g-ming { color: var(--zw-ming); }
  .zw-gname.g-shen { color: var(--zw-shen); }
  .zw-tag {
    font-style: normal;
    font-size: clamp(7px, 1.1cqh, 8px);
    line-height: 1;
    padding: 2px 4px;
    border-radius: 5px;
    border: 1px solid;
  }
  .zw-tag.t-ming { color: rgba(212,168,67,.85); border-color: rgba(212,168,67,.35); }
  .zw-tag.t-shen { color: rgba(100,168,232,.85); border-color: rgba(100,168,232,.35); }
  .zw-dx {
    margin-left: auto;
    font-family: var(--zw-mono);
    font-size: clamp(8.5px, 1.35cqh, 10px);
    color: rgba(255,255,255,.5);
    white-space: nowrap;
  }
  .zw-cell.cur .zw-dx { color: rgba(233,199,124,.9); }
  .zw-gz { font-family: var(--zw-mono); font-size: clamp(8.5px, 1.35cqh, 10px); color: rgba(255,255,255,.48); }

  .zw-stars { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 0 5px; min-height: 0; }
  .zw-major { font-size: clamp(11px, 2.02cqh, 15px); font-weight: 700; letter-spacing: .03em; line-height: 1.3; color: #F3D28C; white-space: nowrap; }
  .zw-major.b2 { color: #E9CB7E; }
  .zw-major.b3 { color: #D0B26A; }
  .zw-major.b4 { color: #A98B56; }
  .zw-major sup { font-size: clamp(7px, 1.2cqh, 8.5px); color: rgba(243,210,140,.65); margin-left: 1px; font-weight: 400; }
  .zw-major.zw-borrow { opacity: .36; filter: saturate(.4); }
  .zw-empty { font-size: clamp(8px, 1.3cqh, 10px); font-style: italic; color: rgba(255,255,255,.3); }
  .zw-borrow-note { font-family: var(--zw-mono); font-size: clamp(7px, 1.1cqh, 8px); color: rgba(255,255,255,.22); }

  .zw-hua {
    font-style: normal;
    font-size: clamp(7px, 1.1cqh, 8px);
    font-weight: 700;
    line-height: 1;
    padding: 2px 4.5px;
    border-radius: 6px;
    border: 1px solid;
    margin-left: 4px;
    vertical-align: 2px;
  }
  .h-lu   { color: var(--zw-hua-lu);   border-color: rgba(255,255,255,.45); background: rgba(255,255,255,.08); }
  .h-quan { color: var(--zw-hua-quan); border-color: rgba(232,147,62,.45);  background: rgba(232,147,62,.08); }
  .h-ke   { color: var(--zw-hua-ke);   border-color: rgba(126,177,245,.45);background: rgba(126,177,245,.08); }
  .h-ji   { color: var(--zw-hua-ji);   border-color: rgba(240,106,106,.45);background: rgba(240,106,106,.08); }

  .zw-lucky { display: flex; flex-wrap: wrap; gap: 0 5px; font-size: clamp(9px, 1.55cqh, 11px); line-height: 1.35; color: rgba(140,192,248,.8); }
  .zw-sha   { display: flex; flex-wrap: wrap; gap: 0 5px; font-size: clamp(9px, 1.55cqh, 11px); line-height: 1.35; color: rgba(248,130,130,.78); }
  /* 吉星 / 煞星同排一行，省一行高度 */
  .zw-fortune { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .zw-zihua { font-family: var(--zw-mono); font-size: clamp(8px, 1.25cqh, 9.5px); color: rgba(255,255,255,.48); margin-top: auto; }

  /* 中央信息格 */
  .zw-center {
    grid-column: 2 / span 2;
    grid-row: 2 / span 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 7px;
    padding: 15px 17px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    animation: zwCellIn .55s cubic-bezier(.2,.8,.2,1) .5s both;
    min-width: 0;
  }
  .zw-kv {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    font-family: var(--zw-mono);
    font-size: clamp(10px, 2.5cqh, 12px);
    color: rgba(255,255,255,.55);
  }
  .zw-kv b { color: rgba(255,255,255,.85); font-weight: 500; letter-spacing: .05em; text-align: right; }
  .zw-kv.hl b { color: rgba(255,255,255,.98); }

  /* ---------- 命盘页：左栏 AI · 右栏十二宫 ---------- */
  .zw-cols-chart { grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr); align-items: stretch; }
  .zw-col-ai { min-height: 0; display: flex; flex-direction: column; }
  .zw-col-chart { min-height: 0; display: flex; flex-direction: column; }

  /* ---------- AI 解读 ---------- */
  .zw-ai { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .zw-ai-log {
    flex: 1;
    min-height: 0;
    margin-top: 13px;
    overflow-y: auto;
    font-size: 13.5px;
    line-height: 1.95;
    color: rgba(255,255,255,.85);
    text-shadow: 0 1px 10px rgba(0,0,0,.55);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.14) transparent;
    padding-right: 6px;
  }
  .zw-ai-log::-webkit-scrollbar { width: 5px; }
  .zw-ai-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

  .zw-ai-hint {
    font-family: var(--zw-mono);
    font-size: 12px;
    color: rgba(255,255,255,.32);
    letter-spacing: .08em;
    line-height: 2;
    padding: 26px 6px;
    text-align: center;
  }
  .zw-u-bubble {
    font-family: var(--zw-sans);
    font-size: 13px;
    line-height: 1.7;
    color: rgba(255,255,255,.94);
    letter-spacing: .02em;
    margin: 18px 0 10px;
    padding: 9px 13px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.2);
    border-left: 2px solid rgba(233,199,124,.6);
    border-radius: 4px 11px 11px 4px;
    width: fit-content;
    max-width: 100%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .zw-a-md { white-space: normal; word-break: break-word; }
  .zw-a-md b { color: rgba(255,255,255,.95); }
  .zw-a-md .md-h {
    display: block;
    font-weight: 600;
    font-size: 14.5px;
    color: rgba(255,255,255,.95);
    margin: 14px 0 4px;
    letter-spacing: .04em;
  }
  .zw-a-md .md-li { display: block; padding-left: 10px; }
  .zw-a-md .md-k {
    display: inline-block;
    font-weight: 600;
    color: rgba(255,255,255,.95);
    letter-spacing: .14em;
    margin-right: 9px;
  }
  .zw-caret::after {
    content: '▍';
    color: rgba(255,255,255,.85);
    animation: zwBlink 1s steps(2, start) infinite;
    margin-left: 1px;
  }
  @keyframes zwBlink { to { visibility: hidden; } }
  .zw-thinking {
    font-family: var(--zw-mono);
    font-size: 11px;
    color: rgba(255,255,255,.35);
    letter-spacing: .1em;
    animation: zwPulse 1.6s ease-in-out infinite;
  }
  @keyframes zwPulse { 50% { opacity: .45; } }

  .zw-ai-bar { display: flex; gap: 9px; margin-top: 15px; }
  .zw-ai-bar input {
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 11px;
    color: rgba(255,255,255,.9);
    padding: 10px 14px;
    font-size: 13.5px;
    font-family: var(--zw-sans);
    outline: none;
    transition: border-color .22s, box-shadow .22s;
  }
  .zw-ai-bar input:focus { border-color: rgba(255,255,255,.55); box-shadow: 0 0 0 3px rgba(255,255,255,.1); }
  .zw-ai-bar input:disabled { opacity: .4; }
  .zw-ai-bar button {
    border: 1px solid rgba(255,255,255,.4);
    color: rgba(255,255,255,.95);
    background: rgba(255,255,255,.06);
    border-radius: 11px;
    padding: 0 20px;
    font-size: 13px;
    letter-spacing: .2em;
    text-indent: .2em;
    font-weight: 600;
    font-family: var(--zw-sans);
    cursor: pointer;
    transition: transform .3s var(--zw-spring), background .25s;
    white-space: nowrap;
  }
  .zw-ai-bar button:hover:not(:disabled) { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.6); }
  .zw-ai-bar button:active:not(:disabled) { transform: scale(.94); }
  .zw-ai-bar button:disabled { opacity: .4; cursor: default; }

  /* 追问快捷问题：手机上少打字 */
  .zw-ai-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .zw-ai-chips[hidden] { display: none; }
  .zw-ai-chips button {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
    color: rgba(255,255,255,.72);
    padding: 6px 13px;
    font-size: 12px;
    font-family: var(--zw-sans);
    letter-spacing: .04em;
    cursor: pointer;
    white-space: nowrap;
    transition: background .22s, border-color .22s, color .22s, transform .2s var(--zw-spring);
  }
  .zw-ai-chips button:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.34); color: #fff; }
  .zw-ai-chips button:active { transform: scale(.95); }

  @media (prefers-reduced-motion: reduce) {
    #sky { display: none; }
    .l1, .l2, .zw-entry { animation: none; }
    .zw-cell, .zw-center, .zw-ai { animation: none; }
    .zw-panel { transition: opacity .2s; transform: none; }
    .zw-overlay.on .zw-panel { transform: none; }
    .stage .line, .stage .zw-entry { transition: opacity .2s; }
  }

  /* ---------- 窄屏 / 手机：整页一起滚，不再锁一屏 ---------- */
  @media (max-width: 860px) {
    .zw-overlay {
      /* 顶部留出关闭按钮，底部避开 iPhone 底部横条 */
      padding: calc(46px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: block;                  /* 关掉居中 flex，内容自然流式排布 */
      overflow-y: auto;                /* 滑动时命盘 + 解读 + 输入框整体上移 */
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .zw-panel { height: auto; min-height: 100%; }
    .zw-close { top: calc(14px + env(safe-area-inset-top)); }
    .zw-cols {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: none;
      gap: 16px;
      padding-top: 8px;
    }
    .zw-cols-chart {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto;
      gap: 12px;
    }
    .zw-cols-chart .zw-col-chart { order: -1; }
    /* 命盘给定高度，字号靠容器查询单位自动缩放；解读区按内容自然撑开 */
    .zw-grid { flex: none; height: clamp(300px, 54vh, 430px); }
    .zw-col-chart, .zw-col-ai, .zw-ai { min-height: 0; flex: none; }
    .zw-ai-log { overflow: visible; padding-right: 0; }
    .zw-a-md { scroll-margin-top: 64px; }   /* scrollIntoView 时别顶到关闭按钮下面 */
    /* 表单页：单列，整体垂直居中 */
    .zw-cols-form {
      max-width: none;
      grid-template-rows: none;
      align-content: center;
    }
    .zw-col-form { justify-content: center; }
    .zw-title { font-size: clamp(24px, 6.4vw, 32px); }
    .zw-form { max-width: none; gap: 10px; }
    .zw-field { gap: 5px; }
    .zw-input, .zw-select { padding: 8px 11px; font-size: 13px; }
    .zw-seg button { padding: 7px 18px; font-size: 12.5px; }
    .zw-go { padding: 10px; font-size: 14px; }
    .zw-grid { gap: 4px; }
    .zw-cell { padding: 5px 6px; border-radius: 8px; gap: 1px; }
    .zw-major { font-size: 11.5px; line-height: 1.3; }
    .zw-gname { font-size: 10px; }
    .zw-lucky, .zw-sha { font-size: 8.5px; }
    .zw-gz, .zw-dx { font-size: 8.5px; }
    .zw-center { padding: 7px 9px; gap: 3px; }
    .zw-kv { font-size: 9px; }
    .zw-head { padding-bottom: 8px; }
    .zw-title-chart {
      font-size: 13px !important;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .zw-ai-log { margin-top: 8px; font-size: 12.5px; line-height: 1.85; }
    .zw-ai-bar { margin-top: 10px; gap: 6px; }
    .zw-ai-bar input { padding: 8px 11px; font-size: 12.5px; }
    .zw-ai-bar button { padding: 0 14px; font-size: 12px; }
    .zw-ai-hint { font-size: 10.5px; line-height: 1.7; padding: 14px 4px; }
    .zw-jelly-body { padding: 12px 24px; font-size: 11.5px; letter-spacing: .26em; }
    .zw-entry-txt { padding-left: .26em; }
  }

  /* 矮屏手机（如 iPhone SE）：命盘压矮一点，把高度让给解读正文 */
  @media (max-width: 860px) and (max-height: 700px) {
    .zw-cols-chart { gap: 8px; }
    .zw-grid { height: clamp(260px, 48vh, 380px); }
    .zw-ai-hint { padding: 6px 2px; font-size: 10px; line-height: 1.6; }
    .zw-ai-log { margin-top: 6px; }
    .zw-ai-bar { margin-top: 6px; }
    .zw-head { padding-bottom: 5px; }
    .zw-cell { padding: 3px 5px; gap: 0; }
    .zw-gname { font-size: clamp(7.5px, 2.4cqh, 9.5px); }
    .zw-gz, .zw-dx { font-size: clamp(6.5px, 2cqh, 8px); }
    .zw-major { font-size: clamp(8px, 2.7cqh, 10.5px); line-height: 1.25; }
    .zw-major sup { font-size: clamp(5px, 1.6cqh, 6.5px); }
    .zw-lucky, .zw-sha { font-size: clamp(6.5px, 2.1cqh, 8px); line-height: 1.25; }
    .zw-empty, .zw-borrow-note { font-size: clamp(6.5px, 2cqh, 8px); }
    .zw-zihua, .zw-minor { display: none; }   /* 极小屏舍弃次要信息，保证主星完整 */
    .zw-tag { font-size: 6px; padding: 1px 3px; }
    .zw-hua { font-size: 6px; padding: 1px 3px; }
  }

  /* ---------- 手机端首页文字 ---------- */
  @media (max-width: 640px) {
    .block {
      top: 36%;                  /* 小屏略上移，避免重心偏下 */
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: 20px;
    }
    .line {
      font-size: clamp(38px, 12vw, 64px);
      letter-spacing: .1em;
      line-height: 1.26;
      color: rgba(255,255,255,.95);
      white-space: normal;       /* 极窄屏也允许折行，不溢出 */
    }
  }

  /* ---------- 平板 ---------- */
  @media (min-width: 641px) and (max-width: 1024px) {
    .line { font-size: clamp(56px, 8vw, 80px); }
  }

  /* 横屏小高度（比如手机横放）：空间实在不够，退化为浮层内滚动 */
  @media (max-height: 480px) and (orientation: landscape) {
    .block { top: 36%; padding-left: max(24px, env(safe-area-inset-left)); }
    .line { font-size: clamp(26px, 5vw, 40px); line-height: 1.2; }
  }

  /* 可用高度极小时（横屏手机 / 4 寸小屏），单屏实在装不下，才允许浮层内滚动 */
  @media (max-height: 500px) {
    .zw-overlay { display: block; overflow-y: auto; padding: 46px 16px 16px; }
    .zw-panel { height: auto; }
    .zw-cols { grid-template-rows: none; }
    .zw-grid { min-height: 260px; }
  }

  /* ---------- 触屏 / 无鼠标设备：按手指的用法调一遍 ---------- */
  @media (hover: none), (pointer: coarse) {
    /* iOS 聚焦字号 <16px 的输入框会自动放大整页，而浮层不可滚动、放大后很难退回 */
    .zw-input, .zw-select, .zw-ai-bar input { font-size: 16px; }
    .zw-ai-bar input::placeholder { font-size: 14px; }

    /* 手机键盘弹起时浮层收缩到键盘上方（--zw-kb 由 JS 按 visualViewport 写入） */
    .zw-overlay {
      height: calc(100% - var(--zw-kb, 0px));
      transition: opacity .5s ease, visibility .5s, height .22s ease;
    }

    /* 不要点按灰块、不要双击缩放、不要长按选字 */
    .zw-entry, .zw-jelly-body, .zw-close, .zw-go, .zw-seg button,
    .zw-rebtn, .zw-ai-bar button, .zw-check,
    .zw-input, .zw-select, .zw-ai-bar input {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .zw-cell, .zw-center, .zw-center b, .zw-label { user-select: none; -webkit-user-select: none; }

    /* 快捷问题在手机上放宽一点，手指好点 */
    .zw-ai-chips { gap: 7px; margin-top: 10px; }
    .zw-ai-chips button { font-size: 13px; padding: 8px 15px; }

    /* 手机上没有悬停，去掉悬停才有的位移/发光，点按只留按下的回弹 */
    .zw-go:hover { transform: none; box-shadow: none; }
    .zw-entry:hover .zw-jelly-body { border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.05); }
    body { overscroll-behavior-y: none; }   /* 别把下拉刷新带出来 */
  }
</style>
</head>
<body>

<div class="bg">
  <div class="bg-glow"></div>
  <canvas id="sky"></canvas>
</div>

<div class="stage">
  <div class="block">
    <h1 class="line l1">我思</h1>
    <h1 class="line l2">故我在。</h1>
    <button class="zw-entry" id="zw-entry" type="button" aria-label="打开紫微命门">
      <span class="zw-jelly-body"><span class="zw-entry-txt">紫微命门</span></span>
    </button>
  </div>
</div>

<!-- 紫微命门浮层：透明无遮罩，星空持续流动，全程单屏不滚动 -->
<div class="zw-overlay" id="zw-overlay" role="dialog" aria-modal="true" aria-label="紫微命门">
  <div class="zw-panel"><div id="zw-body"></div></div>
</div>
<button class="zw-close" id="zw-close" type="button">关闭 ✕</button>

<script src="assets/jelly-button.js" defer></script>
<script src="assets/ziwei-ui.js" defer></script>
<script>
/* =========================================================================
   mos.caldis.me 背景一比一移植
   参数、运动公式、光学结构（lighter 画线 + destination-out 擦除拖尾）完全照抄
   ========================================================================= */
(() => {
  const CFG = {
    densityDesktop: 2,
    densityCoarse: 1,
    countMin: 800,
    countMax: 2000,
    damping: .83,
    dampingScroll: .14,
    accel: 1.15,
    speedBase: .2,
    speedScroll: 0,
    fieldScaleX: .003,
    fieldScaleY: .002,
    fieldScaleXY: .001,
    angleMul: .1,
    timeX: 0,
    timeY: .00015,
    timeXY: .00035,
    influenceR: 490,
    swirl: 3,
    fade: .115,
    fadeScroll: .3,
    lineWidth: 1.25,
    opacityA: .5,
    opacityB: .43,
    opacityC: .36
  };

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return;

  if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) return;

  let W = 1, H = 1, DPR = 1;
  let particles = [];
  let raf = 0, running = true, lastT = performance.now();
  const ptr = { x: -1e4, y: -1e4, active: false };
  /* 触屏没有悬停：粒子不跟手指，改成点按处起一圈扰动，自己慢慢散掉 */
  const COARSE = window.matchMedia?.('(pointer: coarse)')?.matches ?? false;
  const hasCursor = !COARSE && (window.matchMedia?.('(hover: hover) and (pointer: fine)')?.matches ?? false);
  const pulses = [];                      /* { x, y, t0 }，最多同时 3 个 */
  const PULSE_MS = 900;
  const PULSE_R = 150;
  const PULSE_K = 2.4;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const rnd = x => { const t = 1e4 * Math.sin(x); return t - Math.floor(t); };

  const makeParticle = i => {
    const t = 12.345 * i;
    return {
      x: rnd(t) * W,
      y: rnd(t + 1) * H,
      vx: 0,
      vy: 0,
      seed: 1e3 * rnd(t + 2),
      color: i % 3
    };
  };

  const targetCount = () => {
    const density = COARSE ? CFG.densityCoarse : CFG.densityDesktop;
    const lo = Math.min(CFG.countMin, CFG.countMax);
    const hi = Math.max(CFG.countMin, CFG.countMax);
    return clamp(Math.floor(W * H / 5e3 * density), lo, hi);
  };

  const resize = () => {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    /* 触屏按 1.5 倍渲染：肉眼看不出差别，填充率少约 44%，省电发热 */
    DPR = Math.min(COARSE ? 1.5 : 2, Math.max(1, window.devicePixelRatio || 1));
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    particles = Array.from({ length: targetCount() }, (_, i) => makeParticle(i));
    ctx.clearRect(0, 0, W, H);
  };

  const onPointer = e => {
    const rect = canvas.getBoundingClientRect();
    ptr.x = e.clientX - rect.left;
    ptr.y = e.clientY - rect.top;
    ptr.active = true;
  };
  const onBlur = () => { ptr.active = false; ptr.x = -1e4; ptr.y = -1e4; };

  /* 触屏点按：在按下的位置记一次扰动，由 frame 里的 pulses 处理 */
  const onTap = e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;
    pulses.push({ x, y, t0: performance.now() });
    if (pulses.length > 3) pulses.shift();
  };

  const fieldAngle = (x, y, now, seed) =>
    (Math.sin(x * CFG.fieldScaleX + (seed + now) * CFG.timeX) +
     Math.cos(y * CFG.fieldScaleY - (seed - now) * CFG.timeY) +
     Math.sin((x + y) * CFG.fieldScaleXY + (seed + now) * CFG.timeXY)) / 3
    * Math.PI * CFG.angleMul;

  const STROKES = [
    `rgba(255,255,255,${CFG.opacityA})`,
    `rgba(255,255,255,${CFG.opacityB})`,
    `rgba(255,255,255,${CFG.opacityC})`
  ];

  const frame = now => {
    if (!running) return;
    const dt = clamp(now - lastT, 6, 28);
    lastT = now;

    const want = targetCount();
    if (particles.length < want) {
      for (let i = particles.length; i < want; i++) particles.push(makeParticle(i));
    } else if (particles.length > want) {
      particles.length = want;
    }

    const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    const scrollP = clamp(window.scrollY / maxScroll, 0, 1);
    const fade = clamp(CFG.fade + scrollP * CFG.fadeScroll, 0, 1);

    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = `rgba(0,0,0,${fade})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = CFG.lineWidth;

    const speed = CFG.speedBase + scrollP * CFG.speedScroll;
    const keep = clamp(CFG.damping + scrollP * CFG.dampingScroll, 0, .99);
    const R = CFG.influenceR;
    const segs = [[], [], []];              // 同色合并，每帧只 stroke 3 次
    const step = speed * (dt / 16);

    /* 过期的涟漪先清掉，避免每颗粒子都判断一次 */
    for (let qi = pulses.length - 1; qi >= 0; qi--) {
      if (now - pulses[qi].t0 >= PULSE_MS) pulses.splice(qi, 1);
    }

    for (const p of particles) {
      const ox = p.x, oy = p.y;

      const a = fieldAngle(ox, oy, now, p.seed);
      p.vx = p.vx * keep + Math.cos(a) * CFG.accel;
      p.vy = p.vy * keep + Math.sin(a) * CFG.accel;

      if (ptr.active && R > 0) {
        const dx = ox - ptr.x, dy = oy - ptr.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < R) {
          const k = (1 - d / R) * CFG.swirl;
          p.vx += -dy / d * k;
          p.vy += dx / d * k;
        }
      }

      /* 点按涟漪：切向推力，随时间线性衰减，一圈一圈散开 */
      if (pulses.length) {
        for (let qi = 0; qi < pulses.length; qi++) {
          const q = pulses[qi];
          const age = (now - q.t0) / PULSE_MS;
          const dx = ox - q.x, dy = oy - q.y;
          const d = Math.sqrt(dx * dx + dy * dy) || 1;
          if (d < PULSE_R) {
            const k = (1 - d / PULSE_R) * (1 - age) * PULSE_K;
            p.vx += -dy / d * k;
            p.vy += dx / d * k;
          }
        }
      }

      const nx = ox + p.vx * step;
      const ny = oy + p.vy * step;
      p.x = nx;
      p.y = ny;
      segs[p.color].push(ox, oy, nx, ny);

      if (nx < -40 || nx > W + 40 || ny < -40 || ny > H + 40) {
        const s = p.seed + .001 * now;
        p.x = rnd(s) * W;
        p.y = rnd(s + 1) * H;
        p.vx = 0;
        p.vy = 0;
      }
    }

    for (let c = 0; c < 3; c++) {
      const arr = segs[c];
      if (!arr.length) continue;
      ctx.strokeStyle = STROKES[c];
      ctx.beginPath();
      for (let i = 0; i < arr.length; i += 4) {
        ctx.moveTo(arr[i], arr[i + 1]);
        ctx.lineTo(arr[i + 2], arr[i + 3]);
      }
      ctx.stroke();
    }

    ctx.restore();

    raf = requestAnimationFrame(frame);
  };

  /* 只有真正带鼠标的设备才让粒子响应光标；触屏没有悬停，拖动反而会让流场乱跳，
     所以触屏 / 手写笔设备不挂 pointermove，粒子只靠自身流场一直飘，点按才起涟漪 */
  if (hasCursor) {
    window.addEventListener('pointermove', onPointer, { passive: true });
    window.addEventListener('blur', onBlur);
  } else {
    window.addEventListener('pointerdown', onTap, { passive: true });
  }

  /* 手机键盘弹起时 fixed 浮层不会自己让位：把键盘占掉的高度写成 --zw-kb，
     CSS 用 height 把浮层收缩到键盘上方，追问输入框就不会被盖住 */
  if (COARSE && window.visualViewport) {
    const vv = window.visualViewport;
    const syncKb = () => {
      const kb = Math.max(0, Math.min(window.innerHeight * .6,
        window.innerHeight - vv.height - vv.offsetTop));
      document.documentElement.style.setProperty('--zw-kb', Math.round(kb) + 'px');
    };
    vv.addEventListener('resize', syncKb, { passive: true });
    vv.addEventListener('scroll', syncKb, { passive: true });
    syncKb();
  }
  let rt = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(resize, 150);
  }, { passive: true });
  /* 页面隐藏时暂停 rAF，回来继续（紫微浮层不影响星空，始终流动） */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    } else if (!running) {
      running = true;
      lastT = performance.now();
      raf = requestAnimationFrame(frame);
    }
  });

  resize();
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
